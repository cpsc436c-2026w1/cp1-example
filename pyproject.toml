[project]
name = "cp1-example"
version = "0.1.0"
description = "Checkpoint 1 and 2 example for the CPSC 436C project: the rides case"
requires-python = ">=3.11"
dependencies = [
    "behave==1.3.3",
    "boto3>=1.40",
    "duckdb>=1.4",
    "pydantic>=2.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
